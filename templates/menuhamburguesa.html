<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú Hamburguesa Animado</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
}

/* NAVBAR */

nav{
    background:#111;
    padding:15px 20px;
    position:relative;
}

.nav-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

/* LINKS */

.nav-links{
    display:flex;
    gap:20px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    color:#00bfff;
}

/* BOTÓN HAMBURGUESA */

.hamburger{
    display:none;
    flex-direction:column;
    cursor:pointer;
    gap:5px;
}

.hamburger span{
    width:28px;
    height:3px;
    background:white;
    border-radius:5px;
    transition:0.4s;
}

/* ANIMACIÓN X */

.hamburger.active span:nth-child(1){
    transform:rotate(45deg) translate(5px, 5px);
}

.hamburger.active span:nth-child(2){
    opacity:0;
}

.hamburger.active span:nth-child(3){
    transform:rotate(-45deg) translate(5px, -5px);
}

/* MÓVIL */

@media(max-width:768px){

    .hamburger{
        display:flex;
    }

    .nav-links{
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#222;

        flex-direction:column;
        align-items:center;

        max-height:0;
        overflow:hidden;

        transition:max-height 0.5s ease;
    }

    .nav-links.active{
        max-height:300px;
        padding:20px 0;
    }

    .nav-links a{
        padding:10px;
    }
}

</style>
</head>

<body>

<nav>

    <div class="nav-container">

        <div class="logo">MiWeb</div>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-links" id="navLinks">
            <a href="#">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Portfolio</a>
            <a href="#">Contacto</a>
        </div>

    </div>

</nav>

<script>

const hamburger = document.getElementById("hamburger");
const navLinks = document.getElementById("navLinks");

hamburger.addEventListener("click", () => {

    hamburger.classList.toggle("active");
    navLinks.classList.toggle("active");

});

</script>

</body>
</html>
